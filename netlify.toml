# This project is designed for traditional Python web servers (Render, Railway, Heroku)
# NOT for Netlify (which is for static sites and serverless functions)

[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true
