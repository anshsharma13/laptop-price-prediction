<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Recommendation Form</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"/>
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <div class="brand">Smart Laptop</div>
      <div class="brand-sub">Recommendation System</div>
    </div>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/form" class="active">Recommendation</a>
      <a href="/about">About</a>
    </nav>
  </header>

  <main class="container">
    <h2 class="page-title">Laptop Recommendation Form</h2>

    <form class="card form" method="POST" action="/predict">
      <div class="form-grid">
        <label>
          <span>Budget (₹)</span>
          <input type="number" name="budget" min="0" required placeholder="e.g., 60000" />
        </label>

        <label>
          <span>Purpose</span>
          <select name="purpose" required>
            <option>Student</option>
            <option>Programming</option>
            <option>Gaming</option>
            <option>Video Editing</option>
            <option>Graphic Designing</option>
            <option>Office Work</option>
            <option>AI/ML</option>
          </select>
        </label>

        <label>
          <span>Preferred Brand</span>
          <input type="text" name="brand" placeholder="Any (or type brand)" />
        </label>

        <label>
          <span>Minimum RAM (GB)</span>
          <input type="number" name="min_ram" min="0" placeholder="e.g., 8" />
        </label>

        <label>
          <span>Processor Preference</span>
          <input type="text" name="processor_preference" placeholder="Any (e.g., i7, ryzen 7)" />
        </label>

        <label>
          <span>Storage Requirement</span>
          <input type="text" name="storage_requirement" placeholder="Any (e.g., 512ssd, 1tbssd)" />
        </label>

        <label>
          <span>SSD Required?</span>
          <select name="ssd_required">
            <option>No</option>
            <option>Yes</option>
          </select>
        </label>

        <label>
          <span>Graphics Requirement</span>
          <input type="text" name="graphics_requirement" placeholder="Any (e.g., rtx, nvidia)" />
        </label>

        <label>
          <span>Screen Size (inches)</span>
          <input type="number" step="0.1" name="screen_size" placeholder="e.g., 15.6" />
        </label>

        <label>
          <span>Battery Backup Preference</span>
          <select name="battery_preference">
            <option>Any</option>
            <option>High</option>
            <option>Medium</option>
          </select>
        </label>

        <label>
          <span>Weight Preference</span>
          <select name="weight_preference">
            <option>Any</option>
            <option>Light</option>
            <option>Medium</option>
            <option>Doesn't matter</option>
          </select>
        </label>
      </div>

      <div class="form-actions">
        <button class="btn primary" type="submit">Get Recommendations</button>
      </div>

      <p class="hint">
        Tip: leave optional fields as blank to let the model decide.
      </p>
    </form>
  </main>

  <footer class="footer">
    <span>© Smart Laptop Recommendation System</span>
  </footer>
</body>
</html>
